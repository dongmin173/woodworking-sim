<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>작은 목공 작업실</title>
  <link rel="stylesheet" href="style.css">

  <script defer src="vendor/paper-full.min.js"></script>
  <script defer src="vendor/matter.min.js"></script>
  <script defer src="vendor/martinez.umd.min.js"></script>

  <script defer src="wood.js"></script>
  <script defer src="collision.js"></script>
  <script defer src="viewport.js"></script>

  <script defer src="tools/cursors.js"></script>
  <script defer src="tools/carver.js"></script>
  <script defer src="tools/move.js"></script>
  <script defer src="tools/pencil.js"></script>
  <script defer src="tools/saw.js"></script>
  <script defer src="tools/knife.js"></script>

  <script defer src="app.js"></script>
</head>
<body>
  <header>
    <div>
      <small>COMPUTER GRAPHICS · PROJECT 2</small>
      <h1>작은 목공 작업실</h1>
    </div>

    <nav aria-label="보기 설정">
      <button id="zoom-out" aria-label="축소">−</button>
      <output id="zoom-level" aria-live="polite">100%</output>
      <button id="zoom-in" aria-label="확대">＋</button>
      <button id="zoom-fit">전체 보기</button>
      <button id="reset">Reset</button>
    </nav>
  </header>

  <main>
    <aside aria-label="도구">
      <button data-tool="move" aria-pressed="true">✋ 이동</button>
      <button data-tool="pencil" aria-pressed="false">✏️ 연필</button>
      <button data-tool="saw" aria-pressed="false">🪚 톱</button>
      <button data-tool="knife" aria-pressed="false">🔪 구두칼</button>

      <button id="cancel" disabled>취소 / 연결 종료</button>

      <p>
        연필: 점 이어 그리기<br>
        톱: 끝부분 드래그로 깎기<br>
        구두칼: 4×4px 깎기<br>
        Space+드래그: 화면 이동<br>
        Esc: 연결 종료 / 칼질 취소
      </p>
    </aside>

    <section>
      <div id="workspace">
        <canvas id="canvas" aria-label="목공 작업대"></canvas>
      </div>

      <p id="status" role="status" aria-live="polite">
        작업대를 준비하고 있습니다.
      </p>
    </section>
  </main>

  <footer>
    확대 버튼은 작업대에서 마지막으로 가리킨 위치를 중심으로 확대합니다.
    격자 한 칸은 판자의 1×1픽셀입니다.
    구두칼은 클릭 위치 중심 4×4픽셀을 깎고,
    톱은 누른 채 드래그할 때만 깎습니다.
  </footer>
</body>
</html>
